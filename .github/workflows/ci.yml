name: CI

on:
  push:
    branches: [main]
  pull_request:

# Start every job with no token permissions; each job asks only for what it uses.
permissions: {}

# A newer push to the same branch makes the older run pointless, so cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Needed to clone the repository, and nothing more.
      contents: read

    # The API tests run against a real Postgres, as they do locally; a mock would
    # hide the very bugs they exist to catch (constraints, concurrent updates).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: seepwatch
          POSTGRES_PASSWORD: seepwatch
          POSTGRES_DB: seepwatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seepwatch"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL_TEST: postgresql://seepwatch:seepwatch@localhost:5432/seepwatch_test

    steps:
      # Pinned to commits: a tag can be moved to other code, a commit cannot.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The job never pushes, so don't leave the token in .git/config.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` installs exactly what package-lock.json says and fails if the
      # lockfile is out of date, so CI never resolves different versions than we did.
      - run: npm ci

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
